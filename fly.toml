app = "owncast"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  CLOUDFLARE_STREAM_LIVE_INPUT_ID = "REPLACE_WITH_CLOUDFLARE_INPUT_ID"
  CLOUDFLARE_STREAM_CUSTOMER_CODE = "REPLACE_WITH_CLOUDFLARE_CUSTOMER_CODE"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "owncast_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  memory_mb = 512